services:
  mysql:
    image: mysql:8.4
    container_name: ionic-php-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ionic_db
      MYSQL_ROOT_HOST: "%"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: